services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: contextanchor_falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkor_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: contextanchor_web
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.2-11b-vision-instruct}
    depends_on:
      falkordb:
        condition: service_healthy

  mcp:
    build: .
    container_name: contextanchor_mcp
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "9000:9000"
    volumes:
      - ./app:/code/app
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkor_data:
